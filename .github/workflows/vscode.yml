# VS Code draws Agent Plus's views, notifications and status bar entries differently on Linux, macOS and Windows,
# and check.yml runs on Linux only, with no window. This installs the newest VS Code on each of the three and runs
# test/vscode/run.js there, with a stand-in agent in place of Codex Plus or Claude Code Plus.
#
# Each platform's results folder is kept as an artifact, passed or not: a screenshot of each step, of any step that
# failed, VS Code's logs, and for a failed step the window's HTML and text at that point (its state/ folder).
name: vscode

on:
  push:
    # Try a change to this workflow on a ci/ branch first.
    branches: [main, 'ci/**']
  pull_request:
  # By hand, for trying a fix on the system where a test failed.
  workflow_dispatch:
    inputs:
      os:
        description: The system to run on
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
        default: all
      steps:
        description: A regular expression of window test step names to run; empty runs them all
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the .vsix
        shell: bash
        run: |
          vsix=$(bash build/pack.sh | tail -n 1)
          mv "$vsix" core.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: core.vsix

  run:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      AGENT_PLUS_UI_STEPS: ${{ inputs.steps }}
    steps:
      # Some checks compare source text, so no CRLF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Install the test runner
        shell: bash
        run: npm install --no-save --no-package-lock @vscode/test-electron@3 playwright-core@1
      - name: Run in VS Code
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node test/vscode/run.js core.vsix --out vscode-results
      - name: Run in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node test/vscode/run.js core.vsix --out vscode-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-${{ runner.os }}
          path: vscode-results
          if-no-files-found: warn
